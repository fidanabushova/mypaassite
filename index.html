<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачные технологии - Лабораторная работа</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .tag {
            display: inline-block;
            background-color: #ffb703;
            color: #212529;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 50px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #e2e8f0;
            margin-bottom: 25px;
        }
        .info-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
        }
        .info-box p {
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .info-box p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="tag">Lab</span>
        <h1>Модель PaaS в действии</h1>
        <p>Этот сайт развёрнут через облачную платформу без ручного администрирования серверов.</p>
    </div>
</body>
</html>
